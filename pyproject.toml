[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pypost"
dynamic = ["version"]
description = "HTTP client with GUI and MCP tools for local AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Ilya Ashchepkov", email = "koctep@gmail.com" },
]
dependencies = [
    "PySide6==6.11.1",
    "requests==2.34.2",
    "PyYAML==6.0.3",
    "jinja2==3.1.6",
    "pydantic>=2.11,<3",
    "platformdirs==4.10.0",
    "mcp>=1.27,<2",
    "prometheus_client==0.25.0",
    "sseclient-py==1.9.0",
    "cryptography==48.0.1",
    "keyring==25.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "pytest-timeout>=2,<3",
    "flake8>=7,<8",
    "flake8-print>=5,<6",
    "mypy>=1.15,<2",
    "types-PyYAML>=6,<7",
    "types-PySide6>=6.10,<7",
    "pip-audit>=2,<4",
    "pip-licenses>=5,<6",
]
otel = [
    "opentelemetry-api==1.42.1",
    "opentelemetry-sdk==1.42.1",
]

[project.scripts]
pypost-agent-ui-mcp = "pypost.agent.ui_actions_mcp:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pypost*"]

[tool.setuptools.dynamic]
version = { attr = "pypost.version.__version__" }

[tool.mypy]
python_version = "3.11"
files = ["pypost/core", "pypost/models", "pypost/ui"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
disallow_untyped_defs = false
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["pypost.fixtures.*"]
ignore_errors = true

[tool.pytest.ini_options]
pythonpath = "."
# --cov-fail-under: enforces minimum line coverage for `pypost`.
# Threshold set to 70% (project target; baseline 86%, raised from 60% in PYPOST-565).
addopts = [
    "-v",
    "--tb=short",
    "--cov-fail-under=70",
    "--strict-markers",
    "-m",
    "not slow",
]
markers = [
    "timeout(seconds): fail the test if it runs longer than the given seconds",
    "slow: network-heavy or slow integration tests (excluded from default CI)",
    "live_jira: explicitly opted-in smoke against a protected Jira site",
    "agent_e2e: agent UI e2e / env-pack scenarios (select with -m agent_e2e)",
]
log_cli = true
log_cli_level = "WARNING"
log_format = "%(asctime)s %(levelname)-8s %(name)s: %(message)s"
log_date_format = "%H:%M:%S"
