[pytest]
pythonpath = .
# --cov-fail-under: enforces minimum line coverage for `pypost`.
# Threshold set to 60% (baseline 86%, floor(86/5)*5=85; raised incrementally from 50%).
# Project target is 70%; raise further in follow-up when coverage stabilises.
addopts = -v --tb=short --cov-fail-under=60
markers =
    timeout(seconds): fail the test if it runs longer than the given seconds
log_cli = true
log_cli_level = WARNING
log_format = %(asctime)s %(levelname)-8s %(name)s: %(message)s
log_date_format = %H:%M:%S
