schema_version: "1.0.0"
id: "pypost-examples"
name: "PyPost Official Examples"
version: "2.0.0"
description: "Reference collection library showcasing Jira Cloud, GitLab and GitHub MCP integrations, REST workflows, and local probing."
collections:
  - "collections/jira_mcp.json"
  - "collections/gitlab_mcp.json"
  - "collections/github_mcp.json"
  - "collections/mcp.json"
variables:
  - name: "jira_base_url"
    default: "https://your-company.atlassian.net"
    description: "Jira Cloud site base URL"
    secret: false
  - name: "jira_project_key"
    default: "PROJ"
    description: "Default Jira project key or comma-separated keys"
    secret: false
  - name: "jira_credentials"
    default: ""
    description: "Atlassian account email:api_token"
    secret: true
  - name: "gitlab_base_url"
    default: "https://gitlab.com"
    description: "GitLab instance base URL (GitLab.com or self-managed, no trailing slash)"
    secret: false
  - name: "gitlab_project"
    default: "your-group/your-project"
    description: "Default GitLab project: numeric ID or full path"
    secret: false
  - name: "gitlab_token"
    default: ""
    description: "GitLab personal, project or group access token"
    secret: true
  - name: "github_api_url"
    default: "https://api.github.com"
    description: "GitHub REST API base URL (https://api.github.com or https://<host>/api/v3 for GitHub Enterprise Server, no trailing slash)"
    secret: false
  - name: "github_owner"
    default: "your-org"
    description: "Default GitHub repository owner (user or organization login)"
    secret: false
  - name: "github_repo"
    default: "your-repo"
    description: "Default GitHub repository name (without the owner)"
    secret: false
  - name: "github_token"
    default: ""
    description: "GitHub fine-grained or classic personal access token"
    secret: true
presets:
  jira_cloud:
    jira_base_url: "https://your-company.atlassian.net"
    jira_project_key: "DEMO"
  gitlab_com:
    gitlab_base_url: "https://gitlab.com"
    gitlab_project: "your-group/your-project"
  github_com:
    github_api_url: "https://api.github.com"
    github_owner: "your-org"
    github_repo: "your-repo"
