name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: "pytest (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # PySide6 pulls many .so at import (EGL/GL/XCB, fontconfig, glib, etc.); runner image
      # may omit them until explicitly installed.
      - name: Install Qt / EGL runtime (PySide6 headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libfreetype6 \
            libglib2.0-0 \
            libgl1 \
            libxcb-cursor0 \
            libxkbcommon0

      # Pip wheel cache keyed on requirements.txt content hash (PYPOST-311).
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.in
            requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install test tools
        run: python -m pip install pytest pytest-cov flake8 flake8-print pytest-timeout

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Run lint
        run: python -m flake8 --jobs=1 pypost/

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short --cov=pypost \
            -m "not slow" \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junit-xml=junit.xml \
            --durations=0 --durations-min=1 \
            -o log_cli=false \
            --log-file=pytest.log --log-file-level=WARNING \
            2>&1 | tee pytest-output.txt

      - name: Verify test log guardrails
        if: success()
        run: python scripts/verify_test_log_guardrails.py pytest.log

      - name: Audit test duration budgets
        if: success()
        run: python scripts/audit_test_durations.py pytest-output.txt

      - name: Write job summary
        if: always()
        run: |
          echo "## Test Results — Python ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f junit.xml ]; then
            TOTAL=$(grep -oP 'tests="\K[0-9]+' junit.xml | head -1 || echo "?")
            FAILURES=$(grep -oP 'failures="\K[0-9]+' junit.xml | head -1 || echo "?")
            ERRORS=$(grep -oP 'errors="\K[0-9]+' junit.xml | head -1 || echo "?")
            SKIPPED=$(grep -oP 'skipped="\K[0-9]+' junit.xml | head -1 || echo "?")
            echo "| Metric | Count |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Total | $TOTAL |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Failures | $FAILURES |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Errors | $ERRORS |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Skipped | $SKIPPED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_junit.xml not found — pytest may have failed before producing output._" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Coverage — Python ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage.xml ]; then
            COV=$(python -c \
              "import xml.etree.ElementTree as ET; \
               r = ET.parse('coverage.xml').getroot().get('line-rate','0'); \
               print(f'{float(r)*100:.1f}')")
            THRESHOLD=70
            if python -c "exit(0 if float('$COV') >= $THRESHOLD else 1)"; then
              STATUS=":white_check_mark: PASS"
            else
              STATUS=":x: FAIL (below ${THRESHOLD}% threshold)"
            fi
            echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Line coverage | ${COV}% |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Threshold (--cov-fail-under) | ${THRESHOLD}% |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Status | ${STATUS} |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_coverage.xml not found — coverage report unavailable._" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.python-version }}
          path: junit.xml
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

  make-install-smoke:
    name: "make install smoke (slow)"
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Same pip cache key as main matrix — invalidates when requirements.txt changes.
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.in
            requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install pytest tooling
        run: python -m pip install pytest pytest-timeout

      - name: Run slow Makefile install smoke
        run: |
          python -m pytest tests/test_makefile.py -m slow -v --tb=short

  security-audit:
    name: "pip-audit (dependency CVE scan)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.in
            requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Audit dependencies for known CVEs
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Write job summary
        if: always()
        run: |
          echo "## Dependency CVE scan" >> "$GITHUB_STEP_SUMMARY"
          echo "Scanned \`requirements.txt\` with \`pip-audit\` (PYPOST-778)." \
            >> "$GITHUB_STEP_SUMMARY"
