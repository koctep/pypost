name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  jira-mcp-live-smoke:
    name: "Jira MCP live smoke (protected)"
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: jira-live-smoke
    permissions:
      contents: read
    env:
      PYPOST_LIVE_JIRA_SMOKE: "1"
      JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
      JIRA_CREDENTIALS: ${{ secrets.JIRA_CREDENTIALS }}
      JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/install-qt-egl-runtime

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.in
            requirements.txt
            requirements-dev.in
            requirements-dev.txt
            requirements-otel.in
            requirements-otel.txt

      - name: Install test tooling
        run: python -m pip install -e ".[dev,otel]"

      - name: Run protected read-only smoke
        id: protected-live-smoke
        env:
          PYTEST_ADDOPTS: --junitxml=jira-live-smoke-junit.xml
        run: make test-jira-mcp-live

      - name: Write job summary
        if: always()
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            echo "Jira MCP live smoke: failed" >> "$GITHUB_STEP_SUMMARY"
          elif [ ! -f jira-live-smoke-junit.xml ]; then
            echo "Jira MCP live smoke: failed" >> "$GITHUB_STEP_SUMMARY"
          else
            LIVE_SMOKE_SUMMARY="$(python -c '
          import sys
          from xml.etree import ElementTree

          expected_skip = "live Jira MCP smoke intentionally skipped: opt-in is not enabled"
          try:
              root = ElementTree.parse(sys.argv[1]).getroot()
              cases = root.findall(".//testcase")
              skipped = [case.find("skipped") for case in cases]
              if (
                  len(cases) == 1
                  and len(skipped) == 1
                  and skipped[0] is not None
                  and skipped[0].get("message") == expected_skip
              ):
                  print("intentionally skipped")
              elif len(cases) == 1 and skipped == [None]:
                  print("passed")
              else:
                  print("failed")
          except Exception:
              print("failed")
          ' jira-live-smoke-junit.xml)"
            case "$LIVE_SMOKE_SUMMARY" in
              "intentionally skipped")
                echo "Jira MCP live smoke: intentionally skipped" >> "$GITHUB_STEP_SUMMARY"
                ;;
              "passed")
            echo "Jira MCP live smoke: passed" >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
            echo "Jira MCP live smoke: failed" >> "$GITHUB_STEP_SUMMARY"
                ;;
            esac
          fi

  test:
    name: "pytest (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # PySide6 pulls many .so at import (EGL/GL/XCB, fontconfig, glib, etc.); runner image
      # may omit them until explicitly installed.
      - uses: ./.github/actions/install-qt-egl-runtime

      # Pip wheel cache keyed on lock files and pyproject.toml (PYPOST-311, PYPOST-806).
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.in
            requirements.txt
            requirements-dev.in
            requirements-dev.txt
            requirements-otel.in
            requirements-otel.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and dependencies
        run: python -m pip install -e ".[dev,otel]"

      - name: Run lint
        run: |
          python -m flake8 --jobs=1 pypost/
          python scripts/lint_user_docs.py
          python scripts/check_user_docs_links.py

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short --cov=pypost \
            -m "not slow" \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junit-xml=junit.xml \
            --durations=0 --durations-min=1 \
            -o log_cli=false \
            --log-file=pytest.log --log-file-level=WARNING \
            2>&1 | tee pytest-output.txt

      - name: Verify bounded GUI batch isolation
        run: make test-gui-batch

      - name: Verify test log guardrails
        if: success()
        run: python scripts/verify_test_log_guardrails.py pytest.log

      - name: Audit test duration budgets
        if: success()
        run: python scripts/audit_test_durations.py pytest-output.txt

      - name: Write job summary
        if: always()
        run: |
          echo "## Test Results — Python ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f junit.xml ]; then
            TOTAL=$(grep -oP 'tests="\K[0-9]+' junit.xml | head -1 || echo "?")
            FAILURES=$(grep -oP 'failures="\K[0-9]+' junit.xml | head -1 || echo "?")
            ERRORS=$(grep -oP 'errors="\K[0-9]+' junit.xml | head -1 || echo "?")
            SKIPPED=$(grep -oP 'skipped="\K[0-9]+' junit.xml | head -1 || echo "?")
            echo "| Metric | Count |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Total | $TOTAL |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Failures | $FAILURES |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Errors | $ERRORS |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Skipped | $SKIPPED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_junit.xml not found — pytest may have failed before producing output._" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Coverage — Python ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage.xml ]; then
            COV=$(python -c \
              "import xml.etree.ElementTree as ET; \
               r = ET.parse('coverage.xml').getroot().get('line-rate','0'); \
               print(f'{float(r)*100:.1f}')")
            THRESHOLD=$(python - <<'PY'
          from pathlib import Path
          from scripts.run_parallel_tests import CoverageManager

          _, threshold = CoverageManager(
              Path.cwd(), Path(".coverage_parallel")
          )._read_project_policy()
          if threshold is None:
              raise SystemExit("coverage report fail_under is not configured")
          print(threshold)
          PY
            )
            if python - "$COV" "$THRESHOLD" <<'PY'
          import sys

          raise SystemExit(0 if float(sys.argv[1]) >= float(sys.argv[2]) else 1)
          PY
            then
              STATUS=":white_check_mark: PASS"
            else
              STATUS=":x: FAIL (below ${THRESHOLD}% threshold)"
            fi
            echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Line coverage | ${COV}% |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Threshold (--cov-fail-under) | ${THRESHOLD}% |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Status | ${STATUS} |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_coverage.xml not found — coverage report unavailable._" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "On failure, masked dumps under \`artifacts/agent_e2e/\` (if present)" \
            "are uploaded as artifact \`agent-e2e-failure-artifacts-${{ matrix.python-version }}\`" \
            "(PYPOST-909)." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.python-version }}
          path: junit.xml
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

      # PYPOST-909: upload PYPOST-860 failure dumps from main matrix on failure.
      # PYPOST-910: explicit retention-days (14) for failure triage dumps.
      - name: Upload agent e2e failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-e2e-failure-artifacts-${{ matrix.python-version }}
          path: artifacts/agent_e2e/
          if-no-files-found: ignore
          retention-days: 14

  make-install-smoke:
    name: "make install smoke (slow)"
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Same Qt/EGL set as test / agent-e2e — shared conftest imports PySide6 at collection.
      - uses: ./.github/actions/install-qt-egl-runtime

      # Same pip cache key as main matrix — invalidates when pyproject.toml or locks change.
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.in
            requirements.txt
            requirements-dev.in
            requirements-dev.txt
            requirements-otel.in
            requirements-otel.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install test tooling
        run: python -m pip install -e ".[dev]"

      - name: Run slow Makefile install smoke
        run: |
          python -m pytest tests/test_makefile.py -m slow -v --tb=short

  agent-e2e:
    name: "make test-agent-e2e (env pack)"
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/install-qt-egl-runtime

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.in
            requirements.txt
            requirements-dev.in
            requirements-dev.txt
            requirements-otel.in
            requirements-otel.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Create Makefile .venv with dev+otel so `make test-agent-e2e` can run pytest.
      - name: make install
        run: make install

      # PYPOST-861: first-class make gate for agent e2e / env pack (absorbs PYPOST-854 CI step).
      - name: Run agent e2e env pack via make
        run: make test-agent-e2e

      - name: Write job summary
        if: always()
        run: |
          echo "## Agent e2e / env pack (PYPOST-861)" >> "$GITHUB_STEP_SUMMARY"
          echo "Ran \`make test-agent-e2e\` (\`-m \"agent_e2e and not slow\"\`)" \
            "on Python 3.11. Main \`test\` job still includes the same tests via" \
            "\`-m \"not slow\"\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "On failure, masked dumps under \`artifacts/agent_e2e/\` are uploaded" \
            "as artifact \`agent-e2e-failure-artifacts\` (PYPOST-874)." \
            >> "$GITHUB_STEP_SUMMARY"

      # PYPOST-874: upload PYPOST-860 failure dumps for Actions UI triage.
      # PYPOST-910: explicit retention-days (14) for failure triage dumps.
      - name: Upload agent e2e failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-e2e-failure-artifacts
          path: artifacts/agent_e2e/
          if-no-files-found: ignore
          retention-days: 14

  security-audit:
    name: "pip-audit (dependency CVE scan)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.in
            requirements.txt
            requirements-dev.in
            requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dev tooling (pip-audit)
        run: python -m pip install -e ".[dev]"

      - name: Audit dependencies for known CVEs
        run: pip-audit -r requirements.txt

      - name: Write job summary
        if: always()
        run: |
          echo "## Dependency CVE scan" >> "$GITHUB_STEP_SUMMARY"
          echo "Scanned \`requirements.txt\` with pinned \`pip-audit\` from editable \`[dev]\` extra" \
            " (PYPOST-778, PYPOST-805, PYPOST-806)." \
            >> "$GITHUB_STEP_SUMMARY"

  check-license-inventory:
    name: "check-license-inventory (transitive licenses)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.in
            requirements.txt
            requirements-dev.in
            requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dev tooling (pip-licenses)
        run: python -m pip install -e ".[dev]"

      - name: Verify transitive license inventory
        run: python scripts/generate_license_inventory.py --check

      - name: Write job summary
        if: always()
        run: |
          echo "## Transitive license inventory (PYPOST-809)" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified \`LICENSES/transitive.csv\` matches \`requirements.txt\` via" \
            "\`pip-licenses\` from editable \`[dev]\` extra." \
            >> "$GITHUB_STEP_SUMMARY"

  check-lock:
    name: "check-lock (requirements.txt)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.31" # pinned to avoid resolver-version drift (PYPOST-984)

      - name: Verify production lock file matches source
        run: make check-lock

      - name: Write job summary
        if: always()
        run: |
          echo "## Production dependency lock check (PYPOST-927)" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified \`requirements.txt\` matches \`requirements.in\` via \`make check-lock\`." \
            >> "$GITHUB_STEP_SUMMARY"

  check-lock-dev:
    name: "check-lock-dev (requirements-dev.txt)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.31" # pinned to avoid resolver-version drift (PYPOST-995)

      - name: Verify dev lock file matches source
        run: make check-lock-dev

      - name: Write job summary
        if: always()
        run: |
          echo "## Dev dependency lock check (PYPOST-804)" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified \`requirements-dev.txt\` matches \`requirements-dev.in\` via \`make check-lock-dev\`." \
            >> "$GITHUB_STEP_SUMMARY"

  check-lock-otel:
    name: "check-lock-otel (requirements-otel.txt)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.31" # pinned to avoid resolver-version drift (PYPOST-997)

      - name: Verify otel lock file matches source
        run: make check-lock-otel

      - name: Write job summary
        if: always()
        run: |
          echo "## Otel dependency lock check (PYPOST-997)" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified \`requirements-otel.txt\` matches \`requirements-otel.in\` via \`make check-lock-otel\`." \
            >> "$GITHUB_STEP_SUMMARY"
