name: Install Qt / EGL runtime (PySide6 headless)
description: Ubuntu apt packages for headless PySide6 on CI runners
runs:
  using: composite
  steps:
    - name: Install Qt / EGL runtime (PySide6 headless)
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libdbus-1-3 \
          libegl1 \
          libfontconfig1 \
          libfreetype6 \
          libglib2.0-0 \
          libgl1 \
          libxcb-cursor0 \
          libxkbcommon0
